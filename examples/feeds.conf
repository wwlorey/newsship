# Newsship Feed Configuration Example
# Copy this to ~/.newsship/feeds.conf

# ============================================
# Global Settings
# ============================================

# AI provider (openai or claude)
# If not set, auto-detects based on available API keys
default-provider openai

# Cache directory for generated feeds
cache-dir ~/.newsship/cache

# Logging level: error | warn | info | debug
log-level info

# Optional: Global prompt prefix applied to all feeds
# global-prompt "You are an expert news curator. Focus on accuracy and credibility."

# ============================================
# Cost-Optimized AI Feeds
# ============================================
# Long refresh intervals (86400 = 24 hours) prevent multiple API calls per day
# AI feeds are only regenerated when cache expires

feed tech-news
  prompt "Find 10 recent articles about AI breakthroughs, emerging technology, and major tech industry developments"
  refresh 86400
  max-articles 10
  temperature 0.3

feed security-news
  prompt "Latest CVEs, security vulnerabilities, data breaches, and cybersecurity threats from the past 24 hours"
  model gpt-4o-mini
  refresh 86400
  max-articles 15
  temperature 0.2

feed ai-research
  prompt "Recent AI research papers, breakthroughs in machine learning, and LLM developments from arXiv and major AI labs"
  refresh 86400
  max-articles 8
  temperature 0.3

# ============================================
# Weekly Digest (Even Lower Cost)
# ============================================
# Refresh once per week for less time-sensitive content

feed weekly-tech-digest
  prompt "Most important technology news stories from the past week, including product launches, funding rounds, and industry trends"
  refresh 604800
  max-articles 20
  temperature 0.3

# ============================================
# Cost Comparison
# ============================================
# refresh 3600    = 1 hour   → Up to 24 API calls/day per feed (expensive!)
# refresh 21600   = 6 hours  → Up to 4 API calls/day per feed
# refresh 43200   = 12 hours → Up to 2 API calls/day per feed
# refresh 86400   = 24 hours → 1 API call/day per feed (recommended)
# refresh 604800  = 7 days   → 1 API call/week per feed (very cheap)

# ============================================
# Advanced: Per-Feed Provider Override
# ============================================

# feed claude-news
#   prompt "Comprehensive analysis of today's tech industry developments"
#   provider claude
#   model claude-sonnet-4-5-20250929
#   refresh 86400
#   max-articles 10
#   temperature 0.4

# ============================================
# Temperature Guide
# ============================================
# 0.1-0.2 = Very focused, deterministic (good for factual news)
# 0.3-0.5 = Balanced (recommended for most feeds)
# 0.6-0.8 = More creative/varied (may reduce consistency)
